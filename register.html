<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب | DZ MARKET</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                🇩🇿
            </div>

            <h1>إنشاء حساب</h1>

            <p class="auth-subtitle">
                انضم إلى DZ MARKET وابدأ التسوق أو البيع
            </p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash {{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}


            <form method="POST" action="{{ url_for('auth.register') }}">

                <label for="full_name">
                    الاسم الكامل
                </label>

                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    placeholder="أدخل اسمك الكامل"
                    required
                >


                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    required
                >


                <label for="password">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="أدخل كلمة المرور"
                    minlength="6"
                    required
                >


                <label>
                    نوع الحساب
                </label>

                <div class="role-options">

                    <label class="role-option">
                        <input
                            type="radio"
                            name="role"
                            value="buyer"
                            checked
                        >

                        <span>
                            🛍️ مشتري
                        </span>
                    </label>


                    <label class="role-option">
                        <input
                            type="radio"
                            name="role"
                            value="seller"
                        >

                        <span>
                            🏪 بائع
                        </span>
                    </label>

                </div>


                <button type="submit" class="primary-btn">
                    إنشاء الحساب
                </button>

            </form>


            <p class="auth-footer">
                لديك حساب بالفعل؟
                <a href="{{ url_for('auth.login') }}">
                    تسجيل الدخول
                </a>
            </p>

            <a href="{{ url_for('home') }}" class="back-home">
                ← العودة إلى الصفحة الرئيسية
            </a>

        </div>

    </main>

</body>
</html>
