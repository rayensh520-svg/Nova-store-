<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب | DZ MARKET</title>

    <style>
        :root {
            --burgundy: #64152d;
            --burgundy-dark: #3b0b1b;
            --gold: #c9a45c;
            --cream: #fffaf3;
            --text: #241a1d;
            --muted: #81757a;
            --border: #eadfe2;
            --danger: #b42318;
            --success: #16794c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Tahoma", sans-serif;
            background:
                radial-gradient(circle at top right, rgba(201, 164, 92, 0.16), transparent 35%),
                linear-gradient(145deg, #fffaf3, #f8eef1);
            color: var(--text);
        }

        .page {
            width: min(100%, 560px);
            margin: auto;
            padding: 25px 18px 45px;
        }

        /* LOGO */

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .brand-mark {
            width: 62px;
            height: 62px;
            margin: auto;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                145deg,
                var(--burgundy),
                var(--burgundy-dark)
            );

            color: var(--gold);
            font-size: 27px;
            font-weight: 900;

            box-shadow:
                0 12px 30px rgba(59, 11, 27, 0.22);
        }

        .brand h1 {
            margin: 12px 0 4px;
            font-size: 26px;
            color: var(--burgundy);
        }

        .brand p {
            margin: 0;
            color: var(--muted);
            font-size: 14px;
        }

        /* CARD */

        .card {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(234, 223, 226, 0.9);
            border-radius: 26px;
            padding: 23px 19px;

            box-shadow:
                0 20px 55px rgba(59, 11, 27, 0.10);

            backdrop-filter: blur(14px);
        }

        .card-title {
            margin: 0 0 5px;
            font-size: 21px;
            color: var(--burgundy);
        }

        .card-subtitle {
            margin: 0 0 22px;
            color: var(--muted);
            font-size: 13px;
        }

        /* ROLE */

        .role-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 9px;
        }

        .roles {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .role-option {
            position: relative;
        }

        .role-option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .role-option label {
            display: block;
            padding: 15px 10px;
            text-align: center;

            border: 1px solid var(--border);
            border-radius: 17px;

            background: #fff;
            cursor: pointer;

            transition: 0.2s ease;
        }
