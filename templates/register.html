<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب | VYORA STORE</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<main class="auth-page">

    <section class="auth-card">

        <!-- BRAND -->
        <div class="auth-brand">
            <div class="mini-logo">V</div>

            <div>
                <h1>VYORA</h1>
                <span>STORE</span>
            </div>
        </div>


        <!-- TITLE -->
        <div class="auth-heading">

            <h2>إنشاء حساب</h2>

            <p>
                أنشئ حسابك وابدأ تجربتك مع VYORA STORE
            </p>

        </div>


        <!-- REGISTER FORM -->
        <form id="registerForm">

            <!-- FULL NAME -->
            <div class="form-group">

                <label for="fullName">
                    الاسم الكامل
                </label>

                <input
                    type="text"
                    id="fullName"
                    name="full_name"
                    placeholder="أدخل اسمك الكامل"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- EMAIL -->
            <div class="form-group">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->
            <div class="form-group">

                <label for="password">
                    كلمة السر
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="8 أحرف على الأقل"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->
            <div class="form-group">

                <label for="confirmPassword">
                    تأكيد كلمة السر
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirm_password"
                    placeholder="أعد كتابة كلمة السر"
                    autocomplete="new-password"
                    minlength="8"
                    required
                >

            </div>


            <!-- ACCOUNT TYPE -->
            <div class="form-group">

                <label>
                    نوع الحساب
                </label>

                <div class="account-type">

                    <label class="account-option">

                        <input
                            type="radio"
                            name="role"
                            value="buyer"
                            checked
                        >

                        <span>
                            مشتري
                        </span>

                        <small>
                            أبحث عن المنتجات وأطلبها
                        </small>

                    </label>


                    <label class="account-option">

                        <input
                            type="radio"
                            name="role"
                            value="seller"
                        >

                        <span>
                            بائع
                        </span>

                        <small>
                            أبيع منتجاتي وأدير متجري
                        </small>

                    </label>

                </div>

            </div>


            <!-- TERMS -->
            <div class="terms-row">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <label for="terms">

                    أوافق على شروط الاستخدام
                    وسياسة الخصوصية

                </label>

            </div>


            <!-- ERROR -->
            <div
                id="registerError"
                class="form-message error"
                hidden>
            </div>


            <!-- SUCCESS -->
            <div
                id="registerSuccess"
                class="form-message success"
                hidden>
            </div>


            <!-- BUTTON -->
            <button
                type="submit"
                class="primary-button"
                id="registerButton">

                إنشاء الحساب

            </button>

        </form>


        <!-- LOGIN -->
        <div class="auth-footer">

            <span>
                لديك حساب بالفعل؟
            </span>

            <a href="{{ url_for('login') }}">
                تسجيل الدخول
            </a>

        </div>

    </section>

</main>


<script>

const registerForm =
    document.getElementById("registerForm");

const registerButton =
    document.getElementById("registerButton");

const registerError =
    document.getElementById("registerError");

const registerSuccess =
    document.getElementById("registerSuccess");


registerForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    registerError.hidden = true;
    registerSuccess.hidden = true;

    const fullName =
        document.getElementById("fullName").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const terms =
        document.getElementById("terms").checked;

    const role =
        document.querySelector(
            'input[name="role"]:checked'
        ).value;


    // =========================
    // CLIENT VALIDATION
    // =========================

    if (!fullName) {

        showError("يرجى إدخال الاسم الكامل.");

        return;
    }


    if (password.length < 8) {

        showError(
            "كلمة السر يجب أن تحتوي على 8 أحرف على الأقل."
        );

        return;
    }


    if (password !== confirmPassword) {

        showError(
            "كلمتا السر غير متطابقتين."
        );

        return;
    }


    if (!terms) {

        showError(
            "يجب الموافقة على شروط الاستخدام."
        );

        return;
    }


    // =========================
    // DISABLE BUTTON
    // =========================

    registerButton.disabled = true;

    registerButton.textContent =
        "جارٍ إنشاء الحساب...";


    try {

        // =========================
        // SEND TO BACKEND
        // =========================

        const response = await fetch(
            "/api/auth/register",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    full_name: fullName,
                    email: email,
                    password: password,
                    role: role

                })
            }
        );


        const data =
            await response.json();


        // =========================
        // ERROR
        // =========================

        if (!response.ok || !data.success) {

            showError(
                data.error ||
                "حدث خطأ أثناء إنشاء الحساب."
            );

            registerButton.disabled = false;

            registerButton.textContent =
                "إنشاء الحساب";

            return;
        }


        // =========================
        // SUCCESS
        // =========================

        registerSuccess.textContent =
            "تم إنشاء حسابك بنجاح.";

        registerSuccess.hidden = false;


        // =========================
        // REDIRECT
        // =========================

        setTimeout(function() {

            if (data.user.role === "seller") {

                window.location.href =
                    "/seller/dashboard";

            } else {

                window.location.href =
                    "/home";

            }

        }, 700);


    } catch (error) {

        showError(
            "تعذر الاتصال بالخادم. حاول مرة أخرى."
        );

        registerButton.disabled = false;

        registerButton.textContent =
            "إنشاء الحساب";
    }

});


// =========================
// ERROR FUNCTION
// =========================

function showError(message) {

    registerError.textContent = message;

    registerError.hidden = false;
}

</script>

</body>
</html>
