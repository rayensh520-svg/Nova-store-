<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إنشاء حساب | VYORA STORE</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<main class="auth-page">

    <section class="auth-card">

        <div class="auth-logo">
            <div class="v-icon">V</div>

            <div>
                <strong>VYORA</strong>
                <span>STORE</span>
            </div>
        </div>

        <div class="auth-heading">
            <span>ابدأ تجربتك</span>
            <h1>إنشاء حساب</h1>
            <p>أنشئ حسابك واختر كيف تريد استخدام VYORA.</p>
        </div>

        <form class="auth-form" onsubmit="registerUser(event)">

            <div class="form-group">
                <label for="fullName">الاسم الكامل</label>

                <input
                    id="fullName"
                    name="fullName"
                    type="text"
                    placeholder="أدخل اسمك الكامل"
                    autocomplete="name"
                    required>
            </div>

            <div class="form-group">
                <label for="email">البريد الإلكتروني</label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور</label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    placeholder="أنشئ كلمة مرور قوية"
                    autocomplete="new-password"
                    minlength="8"
                    required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">تأكيد كلمة المرور</label>

                <input
                    id="confirmPassword"
                    name="confirmPassword"
                    type="password"
                    placeholder="أعد إدخال كلمة المرور"
                    autocomplete="new-password"
                    minlength="8"
                    required>
            </div>

            <div class="account-type">

                <label>نوع الحساب</label>

                <div class="account-options">

                    <label class="account-option">
                        <input
                            type="radio"
                            name="accountType"
                            value="buyer"
                            checked>

                        <span>
                            <strong>مشتري</strong>
                            <small>اكتشف واشري المنتجات</small>
                        </span>
                    </label>

                    <label class="account-option">
                        <input
                            type="radio"
                            name="accountType"
                            value="seller">

                        <span>
                            <strong>بائع</strong>
                            <small>أنشئ متجرك وبع منتجاتك</small>
                        </span>
                    </label>

                </div>

            </div>

            <label class="terms-option">

                <input
                    type="checkbox"
                    id="terms"
                    required>

                <span>
                    أوافق على شروط الاستخدام وسياسة الخصوصية.
                </span>

            </label>

            <p id="registerMessage"
               class="form-message"></p>

            <button
                type="submit"
                class="auth-submit">
                إنشاء الحساب
            </button>

        </form>

        <div class="auth-footer">

            <span>لديك حساب بالفعل؟</span>

            <button
                type="button"
                class="text-button"
                onclick="goToLogin()">
                تسجيل الدخول
            </button>

        </div>

    </section>

</main>


<script>

function registerUser(event) {

    event.preventDefault();

    const name =
        document.getElementById("fullName").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("registerMessage");

    if (password.length < 8) {

        message.textContent =
            "كلمة المرور يجب أن تحتوي على 8 أحرف على الأقل.";

        return;
    }

    if (password !== confirmPassword) {

        message.textContent =
            "كلمتا المرور غير متطابقتين.";

        return;
    }

    if (!name || !email) {

        message.textContent =
            "يرجى إكمال جميع المعلومات.";

        return;
    }

    const accountType =
        document.querySelector(
            'input[name="accountType"]:checked'
        ).value;

    message.textContent =
        "جاري إنشاء الحساب...";

    /*
     * مؤقتاً فقط.
     * لاحقاً نربط التسجيل بقاعدة البيانات
     * وFlask API مع التحقق الحقيقي.
     */

    setTimeout(() => {

        if (accountType === "seller") {
            window.location.href = "/seller";
        } else {
            window.location.href = "/home";
        }

    }, 700);
}


function goToLogin() {
    window.location.href = "/login";
}

</script>

</body>
</html>
