<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - DZ MARKET 🇩🇿</title>
</head>

<body>

    <div style="max-width:500px;margin:50px auto;padding:30px;font-family:Arial,sans-serif;">

        <h1>إنشاء حساب 🇩🇿</h1>
        <p>انضم إلى DZ MARKET</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.register') }}">

            <p>
                <label for="full_name">الاسم الكامل</label><br>
                <input
                    type="text"
                    id="full_name"
                    name="full_name"
                    required
                >
            </p>

            <p>
                <label for="email">البريد الإلكتروني</label><br>
                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </p>

            <p>
                <label for="password">كلمة المرور</label><br>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >
            </p>

            <p>
                <label for="role">نوع الحساب</label><br>
                <select id="role" name="role">
                    <option value="buyer">مشتري 🛍️</option>
                    <option value="seller">بائع 🏪</option>
                </select>
            </p>

            <button type="submit">
                إنشاء الحساب
            </button>

        </form>

        <p>
            لديك حساب بالفعل؟
            <a href="{{ url_for('auth.login') }}">
                تسجيل الدخول
            </a>
        </p>

        <p>
            <a href="{{ url_for('home') }}">
                العودة للرئيسية
            </a>
        </p>

    </div>

</body>
</html>
