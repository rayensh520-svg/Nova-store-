<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - DZ MARKET 🇩🇿</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <nav class="navbar">
        <div class="container">
            <a href="{{ url_for('home') }}" class="logo">
                DZ MARKET 🇩🇿
            </a>

            <div class="nav-links">
                <a href="{{ url_for('home') }}">الرئيسية</a>
                <a href="{{ url_for('auth.login') }}">تسجيل الدخول</a>
            </div>
        </div>
    </nav>

    <main class="auth-page">
        <div class="auth-card">

            <h1>إنشاء حساب 🎉</h1>
            <p>انضم إلى DZ MARKET وابدأ رحلتك معنا</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <div class="flash {{ category }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.register') }}">

                <div class="form-group">
                    <label for="full_name">الاسم الكامل</label>
                    <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        placeholder="أدخل اسمك الكامل"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="أدخل كلمة المرور"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="role">نوع الحساب</label>
                    <select id="role" name="role">
                        <option value="buyer">مشتري 🛍️</option>
                        <option value="seller">بائع 🏪</option>
                    </select>
                </div>

                <button type="submit" class="btn-primary">
                    إنشاء الحساب
                </button>

            </form>

            <p class="auth-footer">
                لديك حساب بالفعل؟
                <a href="{{ url_for('auth.login') }}">
                    تسجيل الدخول
                </a>
            </p>

        </div>
    </main>

</body>
</html>
