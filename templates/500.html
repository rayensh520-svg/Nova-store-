<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DZ MARKET — خطأ في الخادم</title>

    <style>
        :root {
            --burgundy: #800020;
            --burgundy-dark: #4d0013;
            --gold: #c9a227;
            --gold-light: #e4c766;

            --cream: #f7f1ed;
            --surface: #fffaf7;
            --text: #2a2023;
            --muted: #756a6f;
            --border: #eadde0;

            --shadow: 0 20px 55px rgba(70, 0, 25, .12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at 10% 15%,
                    rgba(128, 0, 32, .12),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(201, 162, 39, .12),
                    transparent 28%
                ),
                linear-gradient(
                    135deg,
                    #fffaf7,
                    #f5ecee
                );

            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Abstract background */
        .shape {
            position: absolute;
            border: 1px solid rgba(128, 0, 32, .12);
            border-radius: 50%;
            pointer-events: none;
        }

        .shape.one {
            width: 300px;
            height: 300px;
            top: -150px;
            right: -80px;
        }

        .shape.two {
            width: 420px;
            height: 420px;
            bottom: -260px;
            left: -150px;
            border-color: rgba(201, 162, 39, .15);
        }

        .shape.three {
            width: 130px;
            height: 130px;
            top: 18%;
            left: 10%;
            border-color: rgba(128, 0, 32, .08);
        }

        .wrapper {
            width: min(92%, 520px);
            position: relative;
            z-index: 2;
        }

        .card {
            background: rgba(255, 250, 247, .92);
            border: 1px solid rgba(128, 0, 32, .10);
            border-radius: 30px;
            box-shadow: var(--shadow);
            padding: 42px 30px;
            text-align: center;
            backdrop-filter: blur(18px);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            text-decoration: none;
            color: var(--burgundy);
            font-weight: 900;
            font-size: 19px;
            letter-spacing: .4px;
        }

        .brand-mark {
            width: 40px;
            height: 40px;
            border-radius: 13px;
            display: grid;
            place-items: center;
            color: white;

            background:
                linear-gradient(
                    145deg,
                    var(--burgundy),
                    var(--burgundy-dark)
                );

            box-shadow:
                0 8px 20px rgba(128, 0, 32, .25);
        }

        .brand-mark svg {
            width: 22px;
            height: 22px;
        }

        .error-code {
            font-size: clamp(76px, 22vw, 130px);
            line-height: .9;
            font-weight: 950;
            letter-spacing: -7px;

            background:
                linear-gradient(
                    135deg,
                    var(--burgundy),
                    #a52a4a 55%,
                    var(--gold)
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            margin-bottom: 18px;
        }

        h1 {
            font-size: clamp(23px, 6vw, 32px);
            margin-bottom: 12px;
            color: var(--text);
        }

        .description {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.9;
            max-width: 390px;
            margin: 0 auto 28px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            min-height: 48px;
            padding: 0 22px;
            border-radius: 14px;
            border: 1px solid var(--border);

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;

            text-decoration: none;
            font-weight: 800;
            font-size: 14px;

            transition:
                transform .2s ease,
                box-shadow .2s ease,
                background .2s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            color: white;
            border-color: transparent;

            background:
                linear-gradient(
                    135deg,
                    var(--burgundy),
                    var(--burgundy-dark)
                );

            box-shadow:
                0 10px 24px rgba(128, 0, 32, .20);
        }

        .btn-secondary {
            color: var(--burgundy);
            background: rgba(255,255,255,.75);
        }

        .btn svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .hint {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
        }

        /* Dark mode */
        body.dark-mode {
            --cream: #10070a;
            --surface: #1d0d13;
            --text: #f7edf0;
            --muted: #bcaeb3;
            --border: #40232c;

            background:
                radial-gradient(
                    circle at 10% 15%,
                    rgba(128, 0, 32, .42),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(201, 162, 39, .10),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #17080d,
                    #2a0b16,
                    #110609
                );

            color: var(--text);
        }

        body.dark-mode .card {
            background: rgba(29, 13, 19, .90);
            border-color: rgba(228, 199, 102, .10);
        }

        body.dark-mode .btn-secondary {
            background: rgba(255,255,255,.05);
            color: var(--gold-light);
            border-color: var(--border);
        }

        body.dark-mode .hint {
            border-color: var(--border);
        }

        @media (max-width: 480px) {
            .card {
                padding: 34px 20px;
                border-radius: 24px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="shape one"></div>
    <div class="shape two"></div>
    <div class="shape three"></div>

    <main class="wrapper">

        <section class="card">

            <a href="{{ url_for('auth.index') }}" class="brand">

                <span class="brand-mark">
                    <svg viewBox="0 0 24 24"
                         xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 8.5 12 4l7 4.5v7L12 20l-7-4.5z"/>
                        <path d="M8.5 10.5 12 8l3.5 2.5"/>
                        <path d="M9 14h6"/>
                    </svg>
                </span>

                <span>DZ MARKET</span>

            </a>

            <div class="error-code">500</div>

            <h1>حدث خطأ غير متوقع</h1>

            <p class="description">
                يبدو أن الخادم واجه مشكلة مؤقتة أثناء معالجة طلبك.
                لا تقلق، جرّبي العودة للصفحة الرئيسية والمحاولة من جديد.
            </p>

            <div class="actions">

                <a
                    href="{{ url_for('auth.index') }}"
                    class="btn btn-primary"
                >
                    <svg viewBox="0 0 24 24">
                        <path d="m3 11 9-8 9 8"/>
                        <path d="M5 10v10h14V10"/>
                        <path d="M9 20v-6h6v6"/>
                    </svg>

                    الصفحة الرئيسية
                </a>

                <a
                    href="{{ url_for('auth.account') }}"
                    class="btn btn-secondary"
                >
                    <svg viewBox="0 0 24 24">
                        <circle cx="12" cy="8" r="3"/>
                        <path d="M5 20c.8-3.4 3.1-5 7-5s6.2 1.6 7 5"/>
                    </svg>

                    حسابي
                </a>

            </div>

            <div class="hint">
                إذا تكرر الخطأ، يمكنك العودة لاحقًا والمحاولة مرة أخرى.
            </div>

        </section>

    </main>

    <script>
        /* توحيد الثيم مع DZ MARKET */
        const savedTheme = localStorage.getItem("dzmarket-theme");

        if (savedTheme === "dark") {
            document.body.classList.add("dark-mode");
        }

        /* إذا لم يوجد اختيار محفوظ، نحترم إعداد الجهاز */
        if (
            !savedTheme &&
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
        ) {
            document.body.classList.add("dark-mode");
        }
    </script>

</body>
</html>
