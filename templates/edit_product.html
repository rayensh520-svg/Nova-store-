<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تعديل المنتج | VYORA STORE</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<main class="page-container">

    <!-- Header -->
    <header class="page-header">

        <a href="/seller/products"
           class="back-button"
           aria-label="العودة">
            ←
        </a>

        <div>
            <span class="eyebrow">VYORA STORE</span>
            <h1>تعديل المنتج</h1>
        </div>

    </header>


    <!-- Loading -->
    <section id="loadingState" class="empty-state">
        <h2>جاري تحميل المنتج...</h2>
        <p>لحظات فقط.</p>
    </section>


    <!-- Form -->
    <section id="formSection" class="form-card" hidden>

        <form id="editProductForm">

            <!-- Product name -->
            <div class="form-group">

                <label for="name">
                    اسم المنتج
                </label>

                <input
                    id="name"
                    name="name"
                    type="text"
                    maxlength="150"
                    required
                    placeholder="مثال: حقيبة جلدية">

            </div>


            <!-- Description -->
            <div class="form-group">

                <label for="description">
                    وصف المنتج
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    maxlength="5000"
                    placeholder="اكتب وصفًا واضحًا للمنتج..."></textarea>

            </div>


            <!-- Category -->
            <div class="form-group">

                <label for="category">
                    الفئة
                </label>

                <select
                    id="category"
                    name="category"
                    required>

                    <option value="">اختر الفئة</option>

                    <option value="fashion">
                        أزياء
                    </option>

                    <option value="beauty">
                        جمال وعناية
                    </option>

                    <option value="food">
                        أطعمة
                    </option>

                    <option value="home">
                        المنزل
                    </option>

                    <option value="electronics">
                        إلكترونيات
                    </option>

                    <option value="handmade">
                        منتجات يدوية
                    </option>

                    <option value="gifts">
                        هدايا
                    </option>

                    <option value="other">
                        أخرى
                    </option>

                </select>

            </div>


            <!-- Price -->
            <div class="form-group">

                <label for="price">
                    السعر
                </label>

                <input
                    id="price"
                    name="price"
                    type="number"
                    min="0"
                    step="0.01"
                    required
                    placeholder="0.00">

                <small>
                    السعر بالدينار الجزائري.
                </small>

            </div>


            <!-- Availability -->
            <div class="form-group">

                <label>
                    طريقة التوفر
                </label>

                <div class="choice-grid">

                    <label class="choice-card">

                        <input
                            type="radio"
                            name="availability_mode"
                            value="in_stock"
                            checked>

                        <span>
                            <strong>متوفر في المخزون</strong>
                            <small>
                                المنتج لديه كمية محددة.
                            </small>
                        </span>

                    </label>


                    <label class="choice-card">

                        <input
                            type="radio"
                            name="availability_mode"
                            value="made_to_order">

                        <span>
                            <strong>عند الطلب</strong>
                            <small>
                                يتم الاتفاق على الكمية ومدة التحضير.
                            </small>
                        </span>

                    </label>

                </div>

            </div>


            <!-- Quantity -->
            <div
                class="form-group"
                id="quantityGroup">

                <label for="quantity">
                    الكمية المتوفرة
                </label>

                <input
                    id="quantity"
                    name="quantity"
                    type="number"
                    min="0"
                    step="1"
                    placeholder="0">

                <small>
                    لا يمكن للمشتري طلب كمية أكبر من المخزون.
                </small>

            </div>


            <!-- Delivery -->
            <div class="form-group">

                <label for="delivery_info">
                    معلومات التوصيل
                </label>

                <textarea
                    id="delivery_info"
                    name="delivery_info"
                    rows="3"
                    maxlength="2000"
                    placeholder="ولايات التوصيل، المدة، التفاصيل..."></textarea>

            </div>


            <!-- Visibility -->
            <div class="form-group">

                <label>
                    حالة ظهور المنتج
                </label>

                <div class="choice-grid">

                    <label class="choice-card">

                        <input
                            type="radio"
                            name="visibility"
                            value="active"
                            checked>

                        <span>
                            <strong>ظاهر</strong>
                            <small>
                                المنتج يظهر للمشترين.
                            </small>
                        </span>

                    </label>


                    <label class="choice-card">

                        <input
                            type="radio"
                            name="visibility"
                            value="hidden">

                        <span>
                            <strong>مخفي</strong>
                            <small>
                                المنتج لا يظهر في المتجر.
                            </small>
                        </span>

                    </label>

                </div>

            </div>


            <!-- Error -->
            <div
                id="errorMessage"
                class="form-message error"
                hidden>
            </div>


            <!-- Success -->
            <div
                id="successMessage"
                class="form-message success"
                hidden>
            </div>


            <!-- Buttons -->
            <div class="form-actions">

                <button
                    type="submit"
                    id="saveButton"
                    class="primary-button">

                    حفظ التعديلات

                </button>

                <a
                    href="/seller/products"
                    class="secondary-button">

                    إلغاء

                </a>

            </div>

        </form>

    </section>

</main>


<script>

const productId = {{ product_id | tojson }};

const form = document.getElementById("editProductForm");
const loadingState = document.getElementById("loadingState");
const formSection = document.getElementById("formSection");

const errorMessage = document.getElementById("errorMessage");
const successMessage = document.getElementById("successMessage");

const saveButton = document.getElementById("saveButton");

const quantityGroup = document.getElementById("quantityGroup");
const quantityInput = document.getElementById("quantity");


function showError(message) {

    errorMessage.textContent = message;
    errorMessage.hidden = false;

    successMessage.hidden = true;
}


function showSuccess(message) {

    successMessage.textContent = message;
    successMessage.hidden = false;

    errorMessage.hidden = true;
}


function updateAvailabilityUI() {

    const selected =
        document.querySelector(
            'input[name="availability_mode"]:checked'
        );

    if (!selected) return;

    if (selected.value === "made_to_order") {

        quantityGroup.hidden = true;
        quantityInput.value = "";

    } else {

        quantityGroup.hidden = false;

    }
}


document
    .querySelectorAll('input[name="availability_mode"]')
    .forEach(input => {

        input.addEventListener(
            "change",
            updateAvailabilityUI
        );

    });


async function loadProduct() {

    try {

        const authResponse =
            await fetch("/api/auth/me");

        if (!authResponse.ok) {

            window.location.href = "/login";
            return;

        }

        const authData =
            await authResponse.json();

        if (
            !authData.authenticated ||
            authData.user.role !== "seller"
        ) {

            window.location.href = "/home";
            return;

        }


        const response =
            await fetch(
                `/api/seller/products/${productId}`
            );


        const data =
            await response.json();


        if (!response.ok || !data.success) {

            throw new Error(
                data.error ||
                "تعذر تحميل المنتج."
            );

        }


        const product = data.product;


        document.getElementById("name").value =
            product.name || "";


        document.getElementById("description").value =
            product.description || "";


        document.getElementById("category").value =
            product.category || "";


        document.getElementById("price").value =
            product.price ?? "";


        document.getElementById("delivery_info").value =
            product.delivery_info || "";


        const availability =
            product.availability_mode ||
            "in_stock";


        const availabilityRadio =
            document.querySelector(
                `input[name="availability_mode"][value="${availability}"]`
            );


        if (availabilityRadio) {

            availabilityRadio.checked = true;

        }


        if (availability === "in_stock") {

            quantityInput.value =
                product.quantity ?? "";

        }


        const visibility =
            product.visibility ||
            product.status ||
            "active";


        const visibilityRadio =
            document.querySelector(
                `input[name="visibility"][value="${visibility}"]`
            );


        if (visibilityRadio) {

            visibilityRadio.checked = true;

        }


        updateAvailabilityUI();


        loadingState.hidden = true;
        formSection.hidden = false;


    } catch (error) {

        loadingState.innerHTML = `
            <h2>تعذر تحميل المنتج</h2>
            <p>${error.message}</p>
            <a href="/seller/products"
               class="secondary-button">
                العودة إلى المنتجات
            </a>
        `;

    }

}


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        errorMessage.hidden = true;
        successMessage.hidden = true;


        const name =
            document.getElementById("name")
                .value.trim();


        const description =
            document.getElementById("description")
                .value.trim();


        const category =
            document.getElementById("category")
                .value;


        const price =
            Number(
                document.getElementById("price")
                    .value
            );


        const availabilityMode =
            document.querySelector(
                'input[name="availability_mode"]:checked'
            ).value;


        const quantityValue =
            quantityInput.value.trim();


        const deliveryInfo =
            document.getElementById("delivery_info")
                .value.trim();


        const visibility =
            document.querySelector(
                'input[name="visibility"]:checked'
            ).value;


        if (!name) {

            showError("اسم المنتج مطلوب.");
            return;

        }


        if (!category) {

            showError("اختر فئة المنتج.");
            return;

        }


        if (
            !Number.isFinite(price) ||
            price < 0
        ) {

            showError("أدخل سعرًا صحيحًا.");
            return;

        }


        let quantity = null;


        if (availabilityMode === "in_stock") {

            quantity = Number(quantityValue);


            if (
                !Number.isInteger(quantity) ||
                quantity < 0
            ) {

                showError(
                    "أدخل كمية صحيحة للمخزون."
                );

                return;

            }

        }


        saveButton.disabled = true;
        saveButton.textContent =
            "جاري الحفظ...";


        try {

            const response =
                await fetch(
                    `/api/seller/products/${productId}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            name,
                            description,
                            category,
                            price,
                            availability_mode:
                                availabilityMode,

                            quantity,

                            delivery_info:
                                deliveryInfo,

                            visibility

                        })

                    }
                );


            const data =
                await response.json();


            if (!response.ok || !data.success) {

                throw new Error(
                    data.error ||
                    "تعذر حفظ التعديلات."
                );

            }


            showSuccess(
                "تم تحديث المنتج بنجاح."
            );


            setTimeout(() => {

                window.location.href =
                    "/seller/products";

            }, 900);


        } catch (error) {

            showError(
                error.message
            );

            saveButton.disabled = false;

            saveButton.textContent =
                "حفظ التعديلات";

        }

    }
);


loadProduct();

</script>

</body>
</html>
