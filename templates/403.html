<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - الصفحة غير موجودة | DZ MARKET</title>

    <style>
        :root {
            --primary: #800020;
            --primary-dark: #5a0016;
            --gold: #c9a227;
            --gold-light: #e4c766;

            --background: #f7f3f4;
            --surface: #ffffff;
            --text: #241d20;
            --muted: #756b70;
            --border: #eadfe3;

            --shadow: 0 18px 50px rgba(70, 0, 25, .12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 15% 20%, rgba(201,162,39,.12), transparent 28%),
                radial-gradient(circle at 85% 80%, rgba(128,0,32,.10), transparent 30%),
                var(--background);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            transition: .25s ease;
        }

        body.dark-mode {
            --background: #12090c;
            --surface: #1d1014;
            --text: #f7eef1;
            --muted: #bcaeb3;
            --border: #3a252b;

            background:
                radial-gradient(circle at 15% 20%, rgba(201,162,39,.10), transparent 28%),
                radial-gradient(circle at 85% 80%, rgba(128,0,32,.25), transparent 30%),
                linear-gradient(135deg, #12090c, #1d0d12 55%, #10070a);
        }

        .decoration {
            position: fixed;
            border: 1px solid rgba(201,162,39,.18);
            border-radius: 50%;
            pointer-events: none;
        }

        .circle-one {
            width: 280px;
            height: 280px;
            top: -130px;
            right: -100px;
        }

        .circle-two {
            width: 220px;
            height: 220px;
            bottom: -100px;
            left: -80px;
        }

        .container {
            width: 100%;
            max-width: 620px;
            position: relative;
            z-index: 2;
        }

        .card {
            background: rgba(255,255,255,.92);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 46px 28px;
            text-align: center;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
        }

        body.dark-mode .card {
            background: rgba(29,16,20,.94);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 22px;
            color: var(--primary);
            font-size: 18px;
            font-weight: 800;
            letter-spacing: .5px;
        }

        body.dark-mode .brand {
            color: var(--gold-light);
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 8px 20px rgba(128,0,32,.22);
            font-size: 18px;
        }

        .code {
            font-size: clamp(76px, 20vw, 150px);
            line-height: .9;
            font-weight: 900;
            margin: 0;

            background: linear-gradient(
                135deg,
                var(--primary),
                var(--gold)
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            letter-spacing: -7px;
        }

        h1 {
            margin: 22px 0 10px;
            font-size: clamp(25px, 6vw, 36px);
        }

        .description {
            max-width: 470px;
            margin: 0 auto;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.8;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .btn {
            min-width: 145px;
            padding: 13px 20px;
            border-radius: 14px;
            border: 1px solid var(--border);
            text-decoration: none;
            font-weight: 800;
            transition: .2s ease;
        }

        .btn-primary {
            color: white;
            background: linear-gradient(
                135deg,
                var(--primary),
                var(--primary-dark)
            );
            border-color: transparent;
        }

        .btn-secondary {
            color: var(--primary);
            background: var(--surface);
        }

        body.dark-mode .btn-secondary {
            color: var(--gold-light);
            background: #25151a;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .theme-btn {
            position: fixed;
            top: 18px;
            left: 18px;
            width: 42px;
            height: 42px;
            border: 1px solid var(--border);
            border-radius: 13px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            font-size: 18px;
            z-index: 5;
        }

        @media (max-width: 480px) {
            .card {
                padding: 38px 20px;
                border-radius: 24px;
            }

            .description {
                font-size: 15px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="decoration circle-one"></div>
    <div class="decoration circle-two"></div>

    <button
        class="theme-btn"
        id="themeToggle"
        type="button"
        aria-label="تغيير المظهر"
    >
        🌙
    </button>

    <main class="container">
        <section class="card">

            <div class="brand">
                <span class="brand-mark">DZ</span>
                MARKET
            </div>

            <p class="code">404</p>

            <h1>الصفحة غير موجودة</h1>

            <p class="description">
                يبدو أن الصفحة التي تبحث عنها غير موجودة،
                أو أن الرابط تغيّر أو لم يعد متاحًا.
                لا تقلق، نقدر نرجعوك للمكان الصحيح. 🇩🇿
            </p>

            <div class="actions">
                <a
                    href="{{ url_for('auth.index') }}"
                    class="btn btn-primary"
                >
                    🏠 الصفحة الرئيسية
                </a>

                {% if current_user_id %}
                    <a
                        href="{{ url_for('auth.account') }}"
                        class="btn btn-secondary"
                    >
                        👤 حسابي
                    </a>
                {% else %}
                    <a
                        href="{{ url_for('auth.login') }}"
                        class="btn btn-secondary"
                    >
                        🔐 تسجيل الدخول
                    </a>
                {% endif %}
            </div>

        </section>
    </main>

    <script>
        const body = document.body;
        const toggle = document.getElementById("themeToggle");

        function applyTheme() {
            const theme = localStorage.getItem("dzmarket-theme");

            if (theme === "dark") {
                body.classList.add("dark-mode");
                toggle.textContent = "☀️";
            } else {
                body.classList.remove("dark-mode");
                toggle.textContent = "🌙";
            }
        }

        toggle.addEventListener("click", () => {
            const dark = body.classList.toggle("dark-mode");

            localStorage.setItem(
                "dzmarket-theme",
                dark ? "dark" : "light"
            );

            toggle.textContent = dark ? "☀️" : "🌙";
        });

        applyTheme();
    </script>

</body>
</html>
