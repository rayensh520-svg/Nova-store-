<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>403 | DZ MARKET</title>

    <style>
        :root {
            --primary: #800020;
            --primary-dark: #5a0016;
            --gold: #c9a227;
            --gold-light: #e4c766;

            --background: #f7f3f4;
            --surface: #ffffff;
            --surface-soft: #fcf9fa;

            --text: #241d20;
            --muted: #756b70;
            --border: #eadfe3;

            --shadow: 0 18px 50px rgba(70, 0, 25, .12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(128, 0, 32, .08),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(201, 162, 39, .10),
                    transparent 30%
                ),
                var(--background);
        }

        body.dark-mode {
            --background: #12090c;
            --surface: #1d1014;
            --surface-soft: #25151a;
            --text: #f7eef1;
            --muted: #bcaeb3;
            --border: #3a252b;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(128, 0, 32, .32),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(201, 162, 39, .12),
                    transparent 30%
                ),
                linear-gradient(
                    145deg,
                    #12090c,
                    #1b0c11 55%,
                    #10070a
                );
        }

        .container {
            width: min(620px, 100%);
        }

        .card {
            position: relative;
            overflow: hidden;

            text-align: center;

            background: var(--surface);
            border: 1px solid var(--border);

            border-radius: 30px;
            padding: 45px 28px;

            box-shadow: var(--shadow);
        }

        .card::before {
            content: "";

            position: absolute;

            width: 230px;
            height: 230px;

            border: 1px solid rgba(128, 0, 32, .08);
            border-radius: 50%;

            top: -130px;
            left: -90px;

            pointer-events: none;
        }

        .card::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            border: 1px solid rgba(201, 162, 39, .10);
            border-radius: 50%;

            bottom: -100px;
            right: -70px;

            pointer-events: none;
        }

        .content {
            position: relative;
            z-index: 2;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;

            color: var(--primary);

            font-weight: 950;
            font-size: 19px;

            margin-bottom: 28px;
        }

        body.dark-mode .brand {
            color: var(--gold-light);
        }

        .code {
            font-size: clamp(70px, 18vw, 120px);
            line-height: 1;

            font-weight: 950;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--gold)
                );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            margin-bottom: 15px;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(24px, 6vw, 34px);
        }

        p {
            color: var(--muted);
            line-height: 1.8;
            margin: 0 auto;
            max-width: 470px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;

            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;

            text-decoration: none;

            padding: 13px 20px;

            border-radius: 14px;

            font-weight: 850;
        }

        .primary {
            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary-dark)
                );

            box-shadow:
                0 10px 25px rgba(128, 0, 32, .20);
        }

        .secondary {
            color: var(--text);

            background: var(--surface-soft);
            border: 1px solid var(--border);
        }

        .theme-btn {
            position: absolute;
            top: 18px;
            left: 18px;

            width: 43px;
            height: 43px;

            border: 1px solid var(--border);
            border-radius: 13px;

            background: var(--surface-soft);
            color: var(--text);

            cursor: pointer;
            font-size: 18px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 38px 20px;
                border-radius: 24px;
            }

            .buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <section class="card">

        <button
            id="themeBtn"
            class="theme-btn"
            type="button"
            aria-label="تغيير المظهر"
        >
            🌙
        </button>

        <div class="content">

            <div class="brand">
                🇩🇿 DZ MARKET
            </div>

            <div class="code">
                403
            </div>

            <h1>
                الوصول غير مسموح
            </h1>

            <p>
                عذراً، ليس لديك الصلاحية للوصول إلى هذه الصفحة.
                إذا كنت تعتقد أن هذا خطأ، تواصل مع فريق الدعم.
            </p>

            <div class="buttons">

                <a
                    href="{{ url_for('auth.index') }}"
                    class="btn primary"
                >
                    العودة للرئيسية
                </a>

                {% if current_user_id %}
                    <a
                        href="{{ url_for('auth.account') }}"
                        class="btn secondary"
                    >
                        حسابي
                    </a>
                {% else %}
                    <a
                        href="{{ url_for('auth.login') }}"
                        class="btn secondary"
                    >
                        تسجيل الدخول
                    </a>
                {% endif %}

            </div>

        </div>

    </section>

</div>

<script>
    const body = document.body;
    const themeBtn = document.getElementById("themeBtn");

    function applyTheme() {

        const theme =
            localStorage.getItem("dzmarket-theme") || "light";

        if (theme === "dark") {

            body.classList.add("dark-mode");

            themeBtn.textContent = "☀️";

        } else {

            body.classList.remove("dark-mode");

            themeBtn.textContent = "🌙";
        }
    }

    themeBtn.addEventListener("click", function () {

        const dark =
            body.classList.contains("dark-mode");

        localStorage.setItem(
            "dzmarket-theme",
            dark ? "light" : "dark"
        );

        applyTheme();
    });

    applyTheme();
</script>

</body>
  </html>
