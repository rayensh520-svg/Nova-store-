<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>منتجاتي | VYORA STORE</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<main class="page-container">

    <!-- HEADER -->
    <header class="page-header">

        <a href="/seller/dashboard" class="back-button">
            رجوع
        </a>

        <div>
            <h1>منتجاتي</h1>
            <span>إدارة منتجات المتجر</span>
        </div>

    </header>


    <!-- TOP ACTION -->
    <section class="page-action">

        <div>
            <h2>إدارة المنتجات</h2>

            <p>
                أضف منتجاتك وعدّل معلوماتها وتابع حالتها.
            </p>
        </div>

        <a href="/seller/products/add"
           class="primary-button">

            إضافة منتج

        </a>

    </section>


    <!-- SEARCH -->
    <section class="filter-panel">

        <div class="form-group">

            <label for="productSearch">
                البحث
            </label>

            <input
                type="search"
                id="productSearch"
                placeholder="ابحث باسم المنتج..."
                autocomplete="off"
            >

        </div>


        <div class="form-group">

            <label for="statusFilter">
                الحالة
            </label>

            <select id="statusFilter">

                <option value="all">
                    كل المنتجات
                </option>

                <option value="active">
                    نشطة
                </option>

                <option value="hidden">
                    مخفية
                </option>

                <option value="out_of_stock">
                    نفدت
                </option>

            </select>

        </div>

    </section>


    <!-- PRODUCTS -->
    <section class="dashboard-section">

        <div class="section-heading">

            <div>

                <h3>
                    المنتجات
                </h3>

                <p id="productCount">
                    جاري التحميل...
                </p>

            </div>

        </div>


        <div
            id="productsList"
            class="products-list">

            <!-- Products will be loaded from backend -->

        </div>


        <!-- EMPTY -->
        <div
            id="productsEmpty"
            class="empty-state"
            hidden>

            <strong>
                لا توجد منتجات
            </strong>

            <span>
                ابدأ بإضافة أول منتج إلى متجرك.
            </span>

            <a
                href="/seller/products/add"
                class="primary-button">

                إضافة أول منتج

            </a>

        </div>


        <!-- ERROR -->
        <div
            id="productsError"
            class="form-message error"
            hidden>
        </div>

    </section>

</main>


<!-- BOTTOM NAV -->
<nav class="bottom-nav">

    <a href="/seller/dashboard">
        الرئيسية
    </a>

    <a href="/seller/products"
       class="active">
        المنتجات
    </a>

    <a href="/seller/orders">
        الطلبات
    </a>

    <a href="/seller/wallet">
        المحفظة
    </a>

    <a href="/profile">
        الحساب
    </a>

</nav>


<script>

// =====================================
// STATE
// =====================================

let allProducts = [];


// =====================================
// LOAD USER
// =====================================

async function checkSellerAccess() {

    try {

        const response =
            await fetch("/api/auth/me");

        const data =
            await response.json();


        if (!response.ok ||
            !data.success ||
            !data.authenticated) {

            window.location.href =
                "/login";

            return false;
        }


        if (data.user.role !== "seller") {

            window.location.href =
                "/home";

            return false;
        }


        return true;

    } catch (error) {

        showError(
            "تعذر التحقق من الحساب."
        );

        return false;
    }
}


// =====================================
// LOAD PRODUCTS
// =====================================

async function loadProducts() {

    /*
        المنتجات ستأتي من:

        GET /api/seller/products

        في المرحلة التالية سنبني هذا
        endpoint داخل Flask.

        لا توجد بيانات وهمية هنا.
    */

    try {

        const response =
            await fetch(
                "/api/seller/products"
            );


        if (response.status === 404) {

            /*
                Endpoint لم يتم إنشاؤه
                بعد، لذلك لا نعرض بيانات وهمية.
            */

            allProducts = [];

            renderProducts();

            return;
        }


        const data =
            await response.json();


        if (!response.ok ||
            !data.success) {

            throw new Error(
                data.error ||
                "Failed to load products"
            );
        }


        allProducts =
            data.products || [];


        renderProducts();


    } catch (error) {

        showError(
            "تعذر تحميل المنتجات."
        );
    }
}


// =====================================
// RENDER PRODUCTS
// =====================================

function renderProducts() {

    const list =
        document.getElementById(
            "productsList"
        );

    const empty =
        document.getElementById(
            "productsEmpty"
        );

    const count =
        document.getElementById(
            "productCount"
        );


    list.innerHTML = "";


    const search =
        document.getElementById(
            "productSearch"
        ).value
        .trim()
        .toLowerCase();


    const status =
        document.getElementById(
            "statusFilter"
        ).value;


    const filtered =
        allProducts.filter(product => {

            const name =
                String(
                    product.name || ""
                ).toLowerCase();


            const matchesSearch =
                !search ||
                name.includes(search);


            const matchesStatus =
                status === "all" ||
                product.status === status;


            return (
                matchesSearch &&
                matchesStatus
            );

        });


    count.textContent =
        `${filtered.length} منتج`;


    if (filtered.length === 0) {

        empty.hidden = false;

        return;
    }


    empty.hidden = true;


    filtered.forEach(product => {

        const card =
            document.createElement(
                "article"
            );

        card.className =
            "product-management-card";


        const image =
            product.image ||
            "";


        const price =
            product.price != null
                ? `${product.price} دج`
                : "—";


        const availability =
            product.availability_mode ===
            "made_to_order"
                ? "عند الطلب"
                : "متوفر في المخزون";


        card.innerHTML = `

            <div class="product-image">

                ${
                    image
                    ? `<img
                        src="${escapeHtml(image)}"
                        alt="${escapeHtml(product.name || "منتج")}"
                      >`
                    : `<span>
                        VYORA
                       </span>`
                }

            </div>


            <div class="product-management-info">

                <h3>
                    ${escapeHtml(
                        product.name || "بدون اسم"
                    )}
                </h3>


                <p>
                    ${escapeHtml(
                        product.category || "غير مصنف"
                    )}
                </p>


                <strong>
                    ${price}
                </strong>


                <span>
                    ${availability}
                </span>

            </div>


            <div class="product-management-actions">

                <a
                    href="/seller/products/${product.id}/edit"
                    class="secondary-button">

                    تعديل

                </a>


                <button
                    type="button"
                    class="danger-button"
                    onclick="deleteProduct(${Number(product.id)})">

                    حذف

                </button>

            </div>

        `;


        list.appendChild(card);

    });

}


// =====================================
// DELETE PRODUCT
// =====================================

async function deleteProduct(productId) {

    const confirmed =
        window.confirm(
            "هل أنت متأكد من حذف هذا المنتج؟"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/seller/products/${productId}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok ||
            !data.success) {

            showError(
                data.error ||
                "تعذر حذف المنتج."
            );

            return;
        }


        await loadProducts();


    } catch (error) {

        showError(
            "تعذر الاتصال بالخادم."
        );
    }

}


// =====================================
// SEARCH
// =====================================

document.getElementById(
    "productSearch"
).addEventListener(
    "input",
    renderProducts
);


// =====================================
// FILTER
// =====================================

document.getElementById(
    "statusFilter"
).addEventListener(
    "change",
    renderProducts
);


// =====================================
// ESCAPE HTML
// =====================================

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


// =====================================
// ERROR
// =====================================

function showError(message) {

    const element =
        document.getElementById(
            "productsError"
        );

    element.textContent =
        message;

    element.hidden = false;
}


// =====================================
// START
// =====================================

(async function() {

    const allowed =
        await checkSellerAccess();


    if (!allowed) {
        return;
    }


    await loadProducts();

})();

</script>

</body>
</html>
