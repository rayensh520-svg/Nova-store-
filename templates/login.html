<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | VYORA STORE</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<main class="auth-page">

    <section class="auth-card">

        <!-- BRAND -->
        <div class="auth-brand">

            <div class="mini-logo">V</div>

            <div>
                <h1>VYORA</h1>
                <span>STORE</span>
            </div>

        </div>


        <!-- TITLE -->
        <div class="auth-heading">

            <h2>مرحباً بعودتك</h2>

            <p>
                سجّل الدخول للمتابعة إلى VYORA STORE
            </p>

        </div>


        <!-- LOGIN FORM -->
        <form id="loginForm">

            <!-- EMAIL -->
            <div class="form-group">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->
            <div class="form-group">

                <label for="password">
                    كلمة السر
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="أدخل كلمة السر"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- OPTIONS -->
            <div class="login-options">

                <label class="remember-option">

                    <input
                        type="checkbox"
                        id="remember"
                    >

                    <span>
                        تذكرني
                    </span>

                </label>


                <a href="{{ url_for('forgot_password') }}">
                    نسيت كلمة السر؟
                </a>

            </div>


            <!-- ERROR -->
            <div
                id="loginError"
                class="form-message error"
                hidden>
            </div>


            <!-- SUCCESS -->
            <div
                id="loginSuccess"
                class="form-message success"
                hidden>
            </div>


            <!-- BUTTON -->
            <button
                type="submit"
                class="primary-button"
                id="loginButton">

                تسجيل الدخول

            </button>

        </form>


        <!-- REGISTER -->
        <div class="auth-footer">

            <span>
                ليس لديك حساب؟
            </span>

            <a href="{{ url_for('register') }}">
                إنشاء حساب
            </a>

        </div>


        <!-- GUEST -->
        <div class="guest-access">

            <button
                type="button"
                id="guestButton"
                class="secondary-button">

                متابعة كزائر

            </button>

        </div>

    </section>

</main>


<script>

const loginForm =
    document.getElementById("loginForm");

const loginButton =
    document.getElementById("loginButton");

const loginError =
    document.getElementById("loginError");

const loginSuccess =
    document.getElementById("loginSuccess");

const guestButton =
    document.getElementById("guestButton");


// ==============================
// LOGIN
// ==============================

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    loginError.hidden = true;
    loginSuccess.hidden = true;


    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    if (!email) {

        showLoginError(
            "يرجى إدخال البريد الإلكتروني."
        );

        return;
    }


    if (!password) {

        showLoginError(
            "يرجى إدخال كلمة السر."
        );

        return;
    }


    loginButton.disabled = true;

    loginButton.textContent =
        "جارٍ تسجيل الدخول...";


    try {

        const response = await fetch(
            "/api/auth/login",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    email: email,
                    password: password

                })
            }
        );


        const data =
            await response.json();


        // ==========================
        // LOGIN ERROR
        // ==========================

        if (!response.ok || !data.success) {

            showLoginError(
                data.error ||
                "البريد الإلكتروني أو كلمة السر غير صحيحة."
            );

            loginButton.disabled = false;

            loginButton.textContent =
                "تسجيل الدخول";

            return;
        }


        // ==========================
        // SUCCESS
        // ==========================

        loginSuccess.textContent =
            "تم تسجيل الدخول بنجاح.";

        loginSuccess.hidden = false;


        // ==========================
        // REDIRECT BY ROLE
        // ==========================

        setTimeout(function() {

            if (data.user.role === "seller") {

                window.location.href =
                    "/seller/dashboard";

            } else {

                window.location.href =
                    "/home";

            }

        }, 500);


    } catch (error) {

        showLoginError(
            "تعذر الاتصال بالخادم. حاول مرة أخرى."
        );

        loginButton.disabled = false;

        loginButton.textContent =
            "تسجيل الدخول";
    }

});


// ==============================
// GUEST
// ==============================

guestButton.addEventListener(
    "click",
    function() {

        window.location.href = "/home";

    }
);


// ==============================
// ERROR
// ==============================

function showLoginError(message) {

    loginError.textContent = message;

    loginError.hidden = false;
}

</script>

</body>
</html>
