<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | VYORA STORE</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <div class="auth-logo">
                <div class="v-icon">V</div>

                <div>
                    <strong>VYORA</strong>
                    <span>STORE</span>
                </div>
            </div>

            <div class="auth-heading">
                <span>مرحباً بعودتك</span>
                <h1>تسجيل الدخول</h1>
                <p>ادخل إلى حسابك لمتابعة تجربتك في VYORA.</p>
            </div>

            <form class="auth-form" onsubmit="loginUser(event)">

                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>

                    <input
                        id="password"
                        name="password"
                        type="password"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required>
                </div>

                <div class="form-options">

                    <label class="remember-option">
                        <input type="checkbox" id="remember">
                        <span>تذكرني</span>
                    </label>

                    <button
                        type="button"
                        class="text-button"
                        onclick="forgotPassword()">
                        نسيت كلمة المرور؟
                    </button>

                </div>

                <p id="loginMessage" class="form-message"></p>

                <button type="submit" class="auth-submit">
                    تسجيل الدخول
                </button>

            </form>

            <div class="auth-divider">
                <span>أو</span>
            </div>

            <button
                type="button"
                class="guest-button"
                onclick="continueAsGuest()">
                المتابعة كزائر
            </button>

            <div class="auth-footer">
                <span>ليس لديك حساب؟</span>

                <button
                    type="button"
                    class="text-button"
                    onclick="createAccount()">
                    إنشاء حساب
                </button>
            </div>

        </section>

    </main>


    <script>

        function loginUser(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;

            const message =
                document.getElementById("loginMessage");

            if (!email || !password) {
                message.textContent =
                    "يرجى إدخال البريد الإلكتروني وكلمة المرور.";
                return;
            }

            /*
             * مؤقتاً:
             * لاحقاً نربط النموذج بـ Flask API
             * ونقوم بالتحقق الحقيقي من الحساب
             * على الخادم.
             */

            message.textContent =
                "جاري تسجيل الدخول...";

            setTimeout(() => {
                window.location.href = "/home";
            }, 700);
        }


        function forgotPassword() {
            window.location.href = "/forgot-password";
        }


        function createAccount() {
            window.location.href = "/register";
        }


        function continueAsGuest() {
            window.location.href = "/home";
        }

    </script>

</body>
</html>
