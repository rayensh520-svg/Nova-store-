<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | DZ MARKET 🇩🇿</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background:
                radial-gradient(circle at top right, #7b1830 0%, transparent 35%),
                linear-gradient(135deg, #210711, #4b1021, #16050b);
            color: white;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo h1 {
            color: #d8ad55;
            font-size: 32px;
        }

        .logo p {
            color: #f4e7d0;
            margin-top: 6px;
            font-size: 14px;
        }

        .card {
            padding: 28px 24px;
            border-radius: 24px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(216,173,85,0.3);
            backdrop-filter: blur(15px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #f5e8d4;
            font-size: 14px;
        }

        .input-box {
            position: relative;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"] {
            width: 100%;
            padding: 14px;
            padding-left: 48px;
            border-radius: 13px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.22);
            color: white;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #d8ad55;
        }

        .toggle {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #d8ad55;
            user-select: none;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #ddd;
        }

        .remember input {
            accent-color: #d8ad55;
        }

        .options a,
        .links a {
            color: #d8ad55;
            text-decoration: none;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #d8ad55, #a87925);
            color: #210711;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        .flash {
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            text-align: center;
            background: rgba(255,255,255,0.1);
        }

        .links {
            text-align: center;
            margin-top: 22px;
            line-height: 2;
            color: #ddd;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>DZ MARKET 🇩🇿</h1>
        <p>مرحبًا بك من جديد</p>
    </div>

    <div class="card">

        <h2>تسجيل الدخول 👋</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <div class="field">
                <label>البريد الإلكتروني</label>

                <div class="input-box">
                    <input
                        type="email"
                        name="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >
                </div>
            </div>

            <div class="field">
                <label>كلمة المرور</label>

                <div class="input-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="أدخل كلمة المرور"
                        autocomplete="current-password"
                        required
                    >

                    <span
                        class="toggle"
                        onclick="togglePassword()"
                        id="toggleIcon"
                    >
                        👁️
                    </span>

                </div>
            </div>

            <div class="options">

                <label class="remember">
                    <input
                        type="checkbox"
                        name="remember"
                    >
                    تذكرني
                </label>

                <a
                    href="#"
                    onclick="forgotPassword(); return false;"
                >
                    نسيت كلمة المرور؟
                </a>

            </div>

            <button type="submit">
                دخول 🚀
            </button>

        </form>

        <div class="links">

            ليس لديك حساب؟
            <a href="{{ url_for('auth.register') }}">
                إنشاء حساب
            </a>

            <br>

            <a href="{{ url_for('home') }}">
                ← العودة للرئيسية
            </a>

        </div>

    </div>

</div>

<script>
    function togglePassword() {

        const password =
            document.getElementById("password");

        const icon =
            document.getElementById("toggleIcon");

        if (password.type === "password") {

            password.type = "text";
            icon.textContent = "🙈";

        } else {

            password.type = "password";
            icon.textContent = "👁️";
        }
    }


    function forgotPassword() {

        alert(
            "ميزة استرجاع كلمة المرور عبر رقم الهاتف و OTP سنربطها لاحقًا."
        );
    }
</script>

</body>
</html>
