<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إضافة منتج | VYORA STORE</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<main class="page-container">

    <header class="page-header">

        <a href="/seller/products" class="back-button">
            رجوع
        </a>

        <div>
            <h1>إضافة منتج</h1>
            <span>VYORA STORE</span>
        </div>

    </header>


    <section class="form-section">

        <div class="section-heading">

            <h2>معلومات المنتج</h2>

            <p>
                أضف معلومات دقيقة وواضحة عن المنتج.
            </p>

        </div>


        <form id="productForm">

            <!-- NAME -->
            <div class="form-group">

                <label for="name">
                    اسم المنتج
                </label>

                <input
                    type="text"
                    id="name"
                    maxlength="150"
                    placeholder="مثال: حقيبة جلدية"
                    required
                >

            </div>


            <!-- DESCRIPTION -->
            <div class="form-group">

                <label for="description">
                    الوصف
                </label>

                <textarea
                    id="description"
                    rows="6"
                    maxlength="5000"
                    placeholder="اكتب وصفًا واضحًا للمنتج..."
                    required
                ></textarea>

            </div>


            <!-- CATEGORY -->
            <div class="form-group">

                <label for="category">
                    التصنيف
                </label>

                <select id="category" required>

                    <option value="">
                        اختر التصنيف
                    </option>

                    <option value="fashion">
                        أزياء
                    </option>

                    <option value="beauty">
                        جمال وعناية
                    </option>

                    <option value="food">
                        أطعمة
                    </option>

                    <option value="home">
                        المنزل
                    </option>

                    <option value="electronics">
                        إلكترونيات
                    </option>

                    <option value="handmade">
                        منتجات يدوية
                    </option>

                    <option value="gifts">
                        هدايا
                    </option>

                    <option value="other">
                        أخرى
                    </option>

                </select>

            </div>


            <!-- PRICE -->
            <div class="form-group">

                <label for="price">
                    السعر بالدينار الجزائري
                </label>

                <input
                    type="number"
                    id="price"
                    min="0"
                    step="0.01"
                    placeholder="0.00"
                    required
                >

            </div>


            <!-- AVAILABILITY -->
            <div class="form-group">

                <label>
                    طريقة التوفر
                </label>


                <div class="account-type">

                    <label class="account-option">

                        <input
                            type="radio"
                            name="availability_mode"
                            value="in_stock"
                            checked
                        >

                        <span>
                            متوفر في المخزون
                        </span>

                        <small>
                            تحدد الكمية المتوفرة للبيع.
                        </small>

                    </label>


                    <label class="account-option">

                        <input
                            type="radio"
                            name="availability_mode"
                            value="made_to_order"
                        >

                        <span>
                            عند الطلب
                        </span>

                        <small>
                            الكمية والتفاصيل يتم الاتفاق عليها عبر المحادثة.
                        </small>

                    </label>

                </div>

            </div>


            <!-- STOCK -->
            <div
                class="form-group"
                id="stockGroup">

                <label for="quantity">
                    الكمية المتوفرة
                </label>

                <input
                    type="number"
                    id="quantity"
                    min="0"
                    step="1"
                    value="1"
                >

            </div>


            <!-- DELIVERY -->
            <div class="form-group">

                <label for="deliveryInfo">
                    معلومات التوصيل
                </label>

                <textarea
                    id="deliveryInfo"
                    rows="4"
                    maxlength="2000"
                    placeholder="ولايات التوصيل، السعر، المدة..."
                ></textarea>

            </div>


            <!-- VISIBILITY -->
            <div class="form-group">

                <label for="visibility">
                    حالة المنتج
                </label>

                <select id="visibility">

                    <option value="active">
                        نشر المنتج
                    </option>

                    <option value="hidden">
                        حفظه مخفيًا
                    </option>

                </select>

            </div>


            <!-- MESSAGE -->
            <div
                id="formMessage"
                class="form-message"
                hidden>
            </div>


            <!-- SUBMIT -->
            <button
                type="submit"
                id="submitButton"
                class="primary-button">

                إضافة المنتج

            </button>

        </form>

    </section>

</main>


<script>

// ==========================================
// ELEMENTS
// ==========================================

const productForm =
    document.getElementById("productForm");

const submitButton =
    document.getElementById("submitButton");

const formMessage =
    document.getElementById("formMessage");

const stockGroup =
    document.getElementById("stockGroup");

const quantityInput =
    document.getElementById("quantity");


// ==========================================
// AVAILABILITY
// ==========================================

document
    .querySelectorAll(
        'input[name="availability_mode"]'
    )
    .forEach(function(input) {

        input.addEventListener(
            "change",
            updateAvailability
        );

    });


function updateAvailability() {

    const selected =
        document.querySelector(
            'input[name="availability_mode"]:checked'
        ).value;


    if (selected === "made_to_order") {

        stockGroup.hidden = true;

        quantityInput.value = "";

    } else {

        stockGroup.hidden = false;

        if (!quantityInput.value) {
            quantityInput.value = "1";
        }

    }

}


// ==========================================
// SELLER ACCESS
// ==========================================

async function checkSeller() {

    try {

        const response =
            await fetch("/api/auth/me");

        const data =
            await response.json();


        if (!response.ok ||
            !data.success ||
            !data.authenticated) {

            window.location.href =
                "/login";

            return false;
        }


        if (data.user.role !== "seller") {

            window.location.href =
                "/home";

            return false;
        }


        return true;


    } catch (error) {

        showMessage(
            "تعذر التحقق من الحساب.",
            "error"
        );

        return false;
    }

}


// ==========================================
// SUBMIT
// ==========================================

productForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        formMessage.hidden = true;


        const name =
            document.getElementById(
                "name"
            ).value.trim();


        const description =
            document.getElementById(
                "description"
            ).value.trim();


        const category =
            document.getElementById(
                "category"
            ).value;


        const price =
            Number(
                document.getElementById(
                    "price"
                ).value
            );


        const availabilityMode =
            document.querySelector(
                'input[name="availability_mode"]:checked'
            ).value;


        const quantityValue =
            quantityInput.value;


        const quantity =
            quantityValue === ""
                ? null
                : Number(quantityValue);


        const deliveryInfo =
            document.getElementById(
                "deliveryInfo"
            ).value.trim();


        const visibility =
            document.getElementById(
                "visibility"
            ).value;


        // ==================================
        // VALIDATION
        // ==================================

        if (!name) {

            showMessage(
                "أدخل اسم المنتج.",
                "error"
            );

            return;
        }


        if (!description) {

            showMessage(
                "أدخل وصف المنتج.",
                "error"
            );

            return;
        }


        if (!category) {

            showMessage(
                "اختر تصنيف المنتج.",
                "error"
            );

            return;
        }


        if (!Number.isFinite(price) ||
            price < 0) {

            showMessage(
                "أدخل سعرًا صالحًا.",
                "error"
            );

            return;
        }


        if (
            availabilityMode === "in_stock" &&
            (
                quantity === null ||
                !Number.isInteger(quantity) ||
                quantity < 0
            )
        ) {

            showMessage(
                "أدخل كمية صحيحة للمخزون.",
                "error"
            );

            return;
        }


        // ==================================
        // LOADING
        // ==================================

        submitButton.disabled = true;

        submitButton.textContent =
            "جارٍ إضافة المنتج...";


        try {

            const response =
                await fetch(
                    "/api/seller/products",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            name: name,

                            description:
                                description,

                            category:
                                category,

                            price:
                                price,

                            availability_mode:
                                availabilityMode,

                            quantity:
                                quantity,

                            delivery_info:
                                deliveryInfo,

                            visibility:
                                visibility

                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok ||
                !data.success) {

                showMessage(
                    data.error ||
                    "تعذر إضافة المنتج.",
                    "error"
                );

                submitButton.disabled = false;

                submitButton.textContent =
                    "إضافة المنتج";

                return;
            }


            // ==================================
            // SUCCESS
            // ==================================

            showMessage(
                "تمت إضافة المنتج بنجاح.",
                "success"
            );


            setTimeout(function() {

                window.location.href =
                    "/seller/products";

            }, 700);


        } catch (error) {

            showMessage(
                "تعذر الاتصال بالخادم.",
                "error"
            );

            submitButton.disabled = false;

            submitButton.textContent =
                "إضافة المنتج";
        }

    }
);


// ==========================================
// MESSAGE
// ==========================================

function showMessage(message, type) {

    formMessage.textContent =
        message;

    formMessage.className =
        `form-message ${type}`;

    formMessage.hidden = false;
}


// ==========================================
// START
// ==========================================

updateAvailability();

checkSeller();

</script>

</body>
</html>
