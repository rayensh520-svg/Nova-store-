<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>استعادة كلمة المرور | VYORA STORE</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<main class="auth-page">

    <section class="auth-card">

        <!-- LOGO -->
        <div class="auth-logo">

            <div class="v-icon">V</div>

            <div>
                <strong>VYORA</strong>
                <span>STORE</span>
            </div>

        </div>


        <!-- HEADING -->
        <div class="auth-heading">

            <span>استعادة الحساب</span>

            <h1>نسيت كلمة المرور؟</h1>

            <p>
                أدخل بريدك الإلكتروني وسنساعدك
                على استعادة الوصول إلى حسابك.
            </p>

        </div>


        <!-- FORM -->
        <form class="auth-form"
              onsubmit="requestReset(event)">

            <div class="form-group">

                <label for="resetEmail">
                    البريد الإلكتروني
                </label>

                <input
                    id="resetEmail"
                    name="email"
                    type="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required>

            </div>


            <p id="resetMessage"
               class="form-message">
            </p>


            <button
                type="submit"
                class="auth-submit">

                إرسال رابط الاستعادة

            </button>

        </form>


        <!-- BACK TO LOGIN -->
        <div class="auth-footer">

            <span>تذكرت كلمة المرور؟</span>

            <button
                type="button"
                class="text-button"
                onclick="goToLogin()">

                تسجيل الدخول

            </button>

        </div>

    </section>

</main>


<script>

function requestReset(event) {

    event.preventDefault();

    const email =
        document.getElementById("resetEmail")
        .value
        .trim();

    const message =
        document.getElementById("resetMessage");

    if (!email) {

        message.textContent =
            "يرجى إدخال البريد الإلكتروني.";

        return;
    }

    message.textContent =
        "جاري إرسال رابط الاستعادة...";

    /*
     * مؤقتاً:
     * لاحقاً نربط هذا النموذج
     * بنظام استعادة كلمة المرور الحقيقي
     * عبر Flask والبريد الإلكتروني.
     */

    setTimeout(() => {

        message.textContent =
            "إذا كان البريد مرتبطاً بحساب، سيتم إرسال تعليمات الاستعادة إليه.";

    }, 900);
}


function goToLogin() {

    window.location.href = "/login";

}

</script>

</body>
</html>
